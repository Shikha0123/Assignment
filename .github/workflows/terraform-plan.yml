name: Terraform Plan

# Runs on every PR that touches Terraform code. Never applies -- this is a
# read-only check that surfaces fmt/validate/plan results (and the plan
# itself) directly on the PR for review.
on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  pull-requests: write # needed to post the plan as a PR comment
  id-token: write # needed for OIDC auth to AWS (no long-lived secrets)

env:
  TF_VERSION: "1.9.8"

jobs:
  terraform:
    name: fmt / init / validate / plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Checked once, repo-wide, rather than per-environment, but cheap
      # enough to just run here too so each matrix leg is self-contained.
      - name: Terraform fmt (check only, no rewriting)
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
        # If no OIDC role is configured yet (e.g. a fork PR, or before the
        # role has been created), skip auth rather than failing the whole
        # job -- `terraform validate` below still runs and catches most
        # issues without needing real AWS credentials.
        continue-on-error: true

      - name: Terraform init
        id: init
        run: terraform init -input=false

      - name: Terraform validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true

      - name: Save plan as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: terraform/environments/${{ matrix.environment }}/tfplan
          retention-days: 14

      - name: Human-readable plan output
        if: always()
        run: terraform show -no-color tfplan > plan_output.txt || true

      - name: Comment plan on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'terraform/environments/${{ matrix.environment }}/plan_output.txt';
            let planText = 'No plan output was produced (see workflow logs).';
            if (fs.existsSync(path)) {
              planText = fs.readFileSync(path, 'utf8');
              if (planText.length > 60000) {
                planText = planText.slice(0, 60000) + '\n\n... (truncated, see the full plan in workflow artifacts)';
              }
            }
            const body = [
              `### Terraform Plan - \`${{ matrix.environment }}\``,
              '',
              `* fmt: \`${{ steps.fmt.outcome }}\``,
              `* init: \`${{ steps.init.outcome }}\``,
              `* validate: \`${{ steps.validate.outcome }}\``,
              `* plan: \`${{ steps.plan.outcome }}\``,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              planText,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = `Terraform Plan - \`${{ matrix.environment }}\``;
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if fmt/validate/plan failed
        if: steps.fmt.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: exit 1
